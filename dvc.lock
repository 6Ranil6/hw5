schema: '2.0'
stages:
  train_all:
    cmd: python -m src.train --variant all_layers
    deps:
    - path: data/tokenized/train.pt
      hash: md5
      md5: e2f7bdf2db7cd7792dba8fcb4d9f9977
      size: 4145185
    - path: data/tokenized/val.pt
      hash: md5
      md5: dcc60e189ad42a2c5c314168211af9b4
      size: 517141
    - path: pyproject.toml
      hash: md5
      md5: e385987062e1fe609327a9902fc6d0c6
      size: 547
    - path: src/checkpoint.py
      hash: md5
      md5: df06efa59c2d0591752c8cf23066a424
      size: 2063
    - path: src/config.py
      hash: md5
      md5: e3ba2d112d11e84808c691e12df2d3ce
      size: 1129
    - path: src/data.py
      hash: md5
      md5: 4e73eec28e8e117b133ac5a7f3283bc5
      size: 2633
    - path: src/runtime.py
      hash: md5
      md5: 82462831487c139d36772cb88ea9fe29
      size: 2825
    - path: src/train.py
      hash: md5
      md5: 42c08aa75087517cde1eff2b6533715f
      size: 17025
    - path: uv.lock
      hash: md5
      md5: 026d56ee212c089288867bea2e732fcc
      size: 647957
    params:
      params.yaml:
        compare:
          max_new_tokens: 128
          prompts:
          - "Расшифровка аудиосообщения:\nХочу предложить историю. Художница готовила
            последнюю выставку в своей старой мастерской. Главную картину уже забрали,
            и в центре стены остался светлый прямоугольник. Она повесила туда пустую
            рамку и подписала её датой переезда. Посетители задерживались перед этой
            работой дольше, чем перед пейзажами.\n\nЗадача для автора: Прозаическая
            миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность:
            тихая грусть. Объём: 10–29 слов. Используй хотя бы одну опорную деталь.
            Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые.
            Не выдавай рассказ за реальные воспоминания пользователя."
          - "Расшифровка аудиосообщения:\nХочу предложить историю. Двое взрослых знакомых
            каждый вечер встречались за чтением. Один хотел предложить прогулку, но
            боялся нарушить привычную тишину. Он вложил в книгу листок с нарисованной
            тропинкой. В следующий раз книга осталась закрытой, а скамья пустовала
            до сумерек.\n\nНапиши художественный текст. Форма: Прозаическая миниатюра:
            оставь одну сцену и один поворот, без заголовка.\nТональность: романтическая
            сдержанность. Объём: 10–29 слов. Используй хотя бы одну опорную деталь.
            Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые.
            Не выдавай рассказ за реальные воспоминания пользователя."
          - "Пользователь написал:\nДедушка показывал взрослой внучке старый печатный
            станок. У неё никак не получалось ровно оттиснуть собственное имя.\n\n\
            Описание изображения:\nНа деревянном столе лежат наборные буквы и лист
            с неровным отпечатком.\n\nПредставь эти материалы в следующем виде. Прозаическая
            миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность:
            ностальгическая радость. Объём: 10–29 слов. Используй хотя бы одну опорную
            деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и
            взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
          - "Расшифровка аудиосообщения:\nХочу предложить историю. Женщина унаследовала
            заброшенный сад. Ключ поворачивался с трудом, а за калиткой всё заросло.
            Она расчистила только одну дорожку и поставила в конце стул. Сад перестал
            казаться неподъёмной работой, когда в нём нашлось место отдохнуть.\n\n\
            Представь эти материалы в следующем виде. Прозаическая миниатюра: оставь
            одну сцену и один поворот, без заголовка.\nТональность: бережная надежда.
            Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики
            можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ
            за реальные воспоминания пользователя."
          - "Пользователь написал:\nПосле тяжёлой смены рабочий проехал свою остановку.
            Он хотел рассердиться, но увидел, как над домами светлеет небо.\n\nОписание
            изображения:\nВ пустом автобусе отражаются огни улицы, на сиденье лежит
            рабочая перчатка.\n\nНапиши художественный текст. Форма: Прозаическая
            миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность:
            меланхолическое облегчение. Объём: 10–29 слов. Используй хотя бы одну
            опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные
            и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
          system: Пиши по-русски на основе переданных заметок, текстовых 
            расшифровок и описаний сцен. Следуй пожеланиям к жанру и длине. 
            Разрешено художественное развитие сюжета. Не утверждай, что сам 
            видел фотографию или слышал аудио; не добавляй комментарий о своей 
            работе.
        data:
          train: data/tokenized/train.pt
          val: data/tokenized/val.pt
        lora:
          r: 8
          alpha: 16
          dropout: 0.05
          target_modules:
          - q_proj
          - k_proj
          - v_proj
          - o_proj
          - gate_proj
          - up_proj
          - down_proj
        model:
          name: Qwen/Qwen3-0.6B
          revision: c1899de289a04d12100db370d81485cdf75e47ca
          mps_prefer_metal: true
          mps_high_watermark_ratio: 0.7
          mps_low_watermark_ratio: 0.6
          device: auto
          dtype: float32
          enable_thinking: false
        paths.metrics: metrics
        paths.models: models
        train:
          attn_implementation: eager
          seed: 42
          epochs: 1
          pad_multiple: 128
          batch_size: 1
          grad_accum: 8
          lr: 0.0002
          warmup_ratio: 0.03
          weight_decay: 0.0
          max_grad_norm: 1.0
          eval_every: 10
          eval_batch_size: 1
          gradient_checkpointing: true
          max_steps:
        variants:
        - name: all_layers
          freeze_first: 0
        - name: freeze14
          freeze_first: 14
    outs:
    - path: metrics/train_all_layers.json
      hash: md5
      md5: 65821539e4d3c906de991143804f8bce
      size: 5696
    - path: models/adapter_all_layers
      hash: md5
      md5: 4208246cf3d200d219ec7c2eea6ae6fa.dir
      size: 31677135
      nfiles: 7
