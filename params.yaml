# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  revision: "c1899de289a04d12100db370d81485cdf75e47ca"
  mps_prefer_metal: true
  mps_high_watermark_ratio: 0.7
  mps_low_watermark_ratio: 0.6
  device: "auto"            # auto | cpu | cuda | mps
  # Float32: в предыдущем bf16-прогоне MPS обнаружены NaN в градиентах.
  dtype: "float32"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  attn_implementation: "eager"
  seed: 42
  epochs: 1
  pad_multiple: 128
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8: память как у батча 1
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Логиты на весь словарь: 2 примера x 512 токенов x 151 936 x 4 байта = 0,6 ГБ.
  # Батч 8 на оценке — уже 2,5 ГБ одних логитов, и ноутбук уходит в своп.
  eval_batch_size: 1
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 128
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "Расшифровка аудиосообщения:\nХочу предложить историю. Художница готовила последнюю выставку в своей старой мастерской. Главную картину уже забрали, и в центре стены остался светлый прямоугольник. Она повесила туда пустую рамку и подписала её датой переезда. Посетители задерживались перед этой работой дольше, чем перед пейзажами.\n\nЗадача для автора: Прозаическая миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность: тихая грусть. Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
    - "Расшифровка аудиосообщения:\nХочу предложить историю. Двое взрослых знакомых каждый вечер встречались за чтением. Один хотел предложить прогулку, но боялся нарушить привычную тишину. Он вложил в книгу листок с нарисованной тропинкой. В следующий раз книга осталась закрытой, а скамья пустовала до сумерек.\n\nНапиши художественный текст. Форма: Прозаическая миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность: романтическая сдержанность. Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
    - "Пользователь написал:\nДедушка показывал взрослой внучке старый печатный станок. У неё никак не получалось ровно оттиснуть собственное имя.\n\nОписание изображения:\nНа деревянном столе лежат наборные буквы и лист с неровным отпечатком.\n\nПредставь эти материалы в следующем виде. Прозаическая миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность: ностальгическая радость. Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
    - "Расшифровка аудиосообщения:\nХочу предложить историю. Женщина унаследовала заброшенный сад. Ключ поворачивался с трудом, а за калиткой всё заросло. Она расчистила только одну дорожку и поставила в конце стул. Сад перестал казаться неподъёмной работой, когда в нём нашлось место отдохнуть.\n\nПредставь эти материалы в следующем виде. Прозаическая миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность: бережная надежда. Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
    - "Пользователь написал:\nПосле тяжёлой смены рабочий проехал свою остановку. Он хотел рассердиться, но увидел, как над домами светлеет небо.\n\nОписание изображения:\nВ пустом автобусе отражаются огни улицы, на сиденье лежит рабочая перчатка.\n\nНапиши художественный текст. Форма: Прозаическая миниатюра: оставь одну сцену и один поворот, без заголовка.\nТональность: меланхолическое облегчение. Объём: 10–29 слов. Используй хотя бы одну опорную деталь. Сюжет и реплики можно выдумывать; все персонажи вымышленные и взрослые. Не выдавай рассказ за реальные воспоминания пользователя."
  system: "Пиши по-русски на основе переданных заметок, текстовых расшифровок и описаний сцен. Следуй пожеланиям к жанру и длине. Разрешено художественное развитие сюжета. Не утверждай, что сам видел фотографию или слышал аудио; не добавляй комментарий о своей работе."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
